---
layout: default
---
<!-- page.html -->
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">
              {%- if page.description_html -%}
                {{ page.description_html }}
              {%- else -%}
                {{ page.description }}
              {%- endif -%}
            </p>
          </header>

          <article>
            {{ content }}
          </article>

        </div>
